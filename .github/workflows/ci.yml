name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Workspace check
        run: cargo check --locked --workspace
      - name: Workspace tests
        run: cargo test --locked --workspace --features adapter-showcase
      - name: Stress harness tests
        run: python3 -m unittest discover -s tools -p test_adapter_stress.py -v
      - name: Ecosystem harness tests
        run: |
          python3 -m unittest discover -s tools -p test_ecosystem_fixture.py -v
          python3 -m unittest discover -s tools -p 'test_reference_mock*.py'
          python3 -m unittest discover -s tools -p test_showcase_pty_smoke.py
          python3 -m unittest discover -s tools -p test_pty_smoke.py
      - name: Docker adapter unit and harness tests
        run: python3 -m unittest discover -s tools -p 'test_docker_adapter*.py' -v
      - name: Workspace clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Showcase check
        run: cargo check --locked --features adapter-showcase --bin dragonstui-showcase
      - name: Showcase clippy
        run: cargo clippy --locked --features adapter-showcase --bin dragonstui-showcase -- -D warnings

  docker-adapter:
    name: Real Docker adapter (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build controller and showcase
        run: cargo build --locked --workspace --features adapter-showcase --bins
      - name: Fetch isolated fixture image
        run: docker pull alpine:3.21
      - name: Real protocol, controller and showcase acceptance
        run: python3 tools/docker_adapter_smoke.py --image alpine:3.21 --output target/r4-docker-evidence
      - name: Retain bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-docker-linux-evidence
          path: target/r4-docker-evidence/
          if-no-files-found: ignore
