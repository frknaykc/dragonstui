name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace --features adapter-showcase
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Showcase check
        run: cargo check --features adapter-showcase --bin dragonstui-showcase
      - name: Showcase tests
        run: cargo test --features adapter-showcase --bin dragonstui-showcase
      - name: Showcase clippy
        run: cargo clippy --features adapter-showcase --bin dragonstui-showcase -- -D warnings
