[package]
name = "dragonstui-adapter-host"
version = "0.1.0"
edition = "2024"
description = "Process-isolated, capability-driven adapter host for DragonsTUI"
license = "MIT"
repository = "https://github.com/frknaykc/dragonstui"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
ureq = "2.12"

[[bin]]
name = "dragonstui-adapter-host-mock"
path = "src/bin/dragonstui_adapter_host_mock.rs"
test = false
bench = false

[[bin]]
name = "dragonstui-adapter"
path = "src/bin/dragonstui_adapter.rs"
test = false
bench = false
